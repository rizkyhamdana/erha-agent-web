<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok OAuth Callback - eR hA Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #EAE2D1;
      color: #111;
    }
    .box {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border: 3px solid #111;
      box-shadow: 8px 8px 0px #111;
    }
    h2 { color: #D9251D; }
    code { background: #eee; padding: 4px 8px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="box">
    <h2>✓ TikTok Authorization Received</h2>
    <p>Your authorization code has been received. You can close this window and return to your application.</p>
    <div id="codeDisplay"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('codeDisplay').innerHTML = '<p><strong>Auth Code:</strong> <code>' + code + '</code></p>';
    }
  </script>
</body>
</html>
